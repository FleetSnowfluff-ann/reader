name: Deploy free translation proxy
on:
  workflow_dispatch:
    inputs:
      confirm_free_plan:
        description: 'I verified this Cloudflare account is on Workers Free and the DeepL key is API Free. No paid plan will be enabled.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: translation-proxy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_free_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: translation-proxy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Deploy the free-only Worker
        run: node scripts/deploy-worker.mjs
        env:
          CONFIRM_FREE_PLAN: 'true'
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
